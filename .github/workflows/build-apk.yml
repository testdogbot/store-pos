name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files (keeps existing lib/ and pubspec.yaml)
        run: flutter create --platforms=android --org com.xiaolele --project-name store_pos .

      - name: Permissions, app name, fixed signing
        run: python3 tool/patch_android.py

      - run: flutter pub get

      - name: Build APK (version 1.0.<run_number>)
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Check signature
        run: keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | head -5

      - name: Rename
        run: cp build/app/outputs/flutter-apk/app-release.apk store-pos-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: store-pos-apk
          path: app/store-pos-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 小店收银 v1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: app/store-pos-${{ github.run_number }}.apk
