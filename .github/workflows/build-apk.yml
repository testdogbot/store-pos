name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files (keeps existing lib/ and pubspec.yaml)
        run: flutter create --platforms=android --org com.xiaolele --project-name store_pos .

      - name: Permissions and app name
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>#' $M
          sed -i 's#android:label="store_pos"#android:label="小店收银"#' $M
          grep -n "permission\|label" $M

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename
        run: cp build/app/outputs/flutter-apk/app-release.apk store-pos-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: store-pos-apk
          path: app/store-pos-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 小店收银 build ${{ github.run_number }}
          files: app/store-pos-${{ github.run_number }}.apk
