name: store_pos
description: 轻量便利店收银：扫码收银 + 商品管理，离线优先 + Cloudflare 同步
publish_to: 'none'
version: 1.0.0+1  # CI 构建时用 --build-name=1.0.<构建号> --build-number=<构建号> 覆盖

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.0
  path: ^1.9.0
  mobile_scanner: ^7.4.0
  shared_preferences: ^2.3.0
  http: ^1.2.0
  uuid: ^4.5.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  package_info_plus: ^8.1.0
  url_launcher: ^6.3.1
  open_filex: ^5.0.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/beep.wav
